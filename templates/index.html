<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise 6/26 - الدردشة المباشرة</title>
    <!-- خط Cairo واستدعاء مكتبات Socket.IO و FontAwesome للأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --msg-my: #1d4ed8;
            --msg-other: #334155;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* النافذة المنبثقة لكلمة السر العامة */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-box {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            margin: 0.75rem 0;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: var(--text-main);
            outline: none;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: none;
            background: var(--accent-color);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover { background: var(--accent-hover); }
        .btn-danger { background: var(--danger); }
        .btn-secondary { background: #475569; }

        /* الشاشة الرئيسية للغرف */
        .auth-container {
            width: 90%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            border: 1px solid var(--border-color);
        }

        .tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border-color);
        }

        .tab {
            flex: 1;
            padding: 0.75rem;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-muted);
        }

        .tab.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
        }

        /* شاشة الدردشة الرئيسية */
        .chat-container {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: row;
            background: var(--bg-color);
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .chat-header {
            background: var(--card-bg);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .messages-area {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .message-card {
            max-width: 75%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            background: var(--msg-other);
            align-self: flex-start;
            position: relative;
            word-break: break-word;
        }

        .message-card.my-msg {
            background: var(--msg-my);
            align-self: flex-end;
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
            gap: 1rem;
        }

        .my-msg .msg-header { color: #cbd5e1; }

        .reply-preview-box {
            background: rgba(0, 0, 0, 0.2);
            border-right: 3px solid var(--accent-color);
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
        }

        .media-preview img, .media-preview video {
            max-width: 100%;
            max-height: 250px;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
        }

        .media-preview audio {
            width: 100%;
            margin-top: 0.5rem;
        }

        .reactions-bar {
            display: flex;
            gap: 0.25rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .reaction-badge {
            background: rgba(0, 0, 0, 0.3);
            padding: 0.1rem 0.4rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .msg-actions {
            display: none;
            position: absolute;
            top: -10px;
            left: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.2rem;
            gap: 0.3rem;
        }

        .message-card:hover .msg-actions { display: flex; }

        .action-btn {
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .action-btn:hover { color: var(--text-main); }

        /* منطقة إدخال الرسالة */
        .chat-input-area {
            background: var(--card-bg);
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .reply-target-bar {
            display: none;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
        }

        .input-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            display: none;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-color);
            transition: width 0.1s;
        }

        /* القائمة الجانبية (المستخدمين والسجل) */
        .sidebar {
            width: 280px;
            background: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-section {
            padding: 1rem;
            flex: 1;
            overflow-y: auto;
        }

        .sidebar-section h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        .status-dot.offline { background: var(--text-muted); }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .message-card { max-width: 88%; }
        }
    </style>
</head>
<body>

    <!-- 1. نافذة التحقق من كلمة السر العامة -->
    <div id="globalModal" class="modal-overlay">
        <div class="modal-box">
            <h2>مرحباً بك 👋</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">يرجى إدخال كلمة سر الموقع لمتابعة الدخول:</p>
            <input type="password" id="globalPasswordInput" class="input-field" placeholder="كلمة السر العامة">
            <button class="btn" onclick="verifyGlobalPassword()">دخول الموقع</button>
            <p id="globalErr" style="color: var(--danger); font-size: 0.85rem; margin-top: 0.5rem; display: none;">كلمة السر خاطئة!</p>
        </div>
    </div>

    <!-- 2. واجهة اختيار أو إنشاء الغرفة -->
    <div id="authScreen" class="auth-container" style="display: none;">
        <h2 style="text-align: center; margin-bottom: 1rem;">Promise 6/26</h2>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('join')">دخول غرفة</div>
            <div class="tab" onclick="switchTab('create')">إنشاء غرفة</div>
        </div>

        <!-- نموذج دخول غرفة -->
        <div id="joinForm">
            <input type="text" id="joinUsername" class="input-field" placeholder="اسمك في المحادثة">
            <input type="text" id="joinRoomName" class="input-field" placeholder="اسم الغرفة">
            <input type="password" id="joinRoomPass" class="input-field" placeholder="كلمة سر الغرفة">
            <button class="btn" onclick="joinRoom()">انضمام الآن</button>
        </div>

        <!-- نموذج إنشاء غرفة -->
        <div id="createForm" style="display: none;">
            <input type="text" id="createRoomName" class="input-field" placeholder="اسم الغرفة الجديدة">
            <input type="password" id="createRoomPass" class="input-field" placeholder="كلمة سر الغرفة">
            <button class="btn" onclick="createRoom()">إنشاء الغرفة</button>
        </div>
    </div>

    <!-- 3. شاشة الدردشة الرئيسيّة -->
    <div id="chatScreen" class="chat-container">
        <div class="chat-main">
            <!-- الهيدر -->
            <div class="chat-header">
                <div>
                    <h3 id="displayRoomName">اسم الغرفة</h3>
                    <span id="displayUsername" style="font-size: 0.8rem; color: var(--text-muted);"></span>
                </div>
                <button class="btn btn-danger" style="width: auto; padding: 0.4rem 0.8rem;" onclick="leaveRoom()">خروج</button>
            </div>

            <!-- منطقة عرض الرسائل -->
            <div class="messages-area" id="messagesContainer">
                <button id="loadMoreBtn" class="btn btn-secondary" style="display: none; margin: 0 auto 1rem auto; width: auto;" onclick="loadMoreMessages()">تحميل الرسائل السابقة</button>
                <div id="messagesList" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
            </div>

            <!-- شريط تقدم الرفع -->
            <div class="progress-container" id="uploadProgressContainer">
                <div class="progress-bar" id="uploadProgressBar"></div>
            </div>

            <!-- منطقة إدخال الرسائل -->
            <div class="chat-input-area">
                <!-- شريط الرد المعلق -->
                <div class="reply-target-bar" id="replyTargetBar">
                    <span id="replyTargetText">الرد على: ...</span>
                    <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="cancelReply()"></i>
                </div>

                <div class="input-row">
                    <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelect()">
                    <button class="btn btn-secondary" style="width: auto; padding: 0.75rem;" onclick="document.getElementById('fileInput').click()">
                        <i class="fa-solid fa-paperclip"></i>
                    </button>
                    <input type="text" id="messageInput" class="input-field" style="margin: 0;" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter') sendMessage()">
                    <button class="btn" style="width: auto; padding: 0.75rem 1.2rem;" onclick="sendMessage()">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
                <span id="selectedFileName" style="font-size: 0.75rem; color: var(--text-muted);"></span>
            </div>
        </div>

        <!-- القائمة الجانبية -->
        <div class="sidebar">
            <div class="sidebar-section">
                <h3> المتواجدون (<span id="onlineCount">0</span>)</h3>
                <div id="onlineUsersList"></div>
            </div>
            <hr style="border-color: var(--border-color);">
            <div class="sidebar-section">
                <h3> سجل المغادرين</h3>
                <div id="offlineUsersList"></div>
            </div>
        </div>
    </div>

    <!-- السكريبتات والتفاعل اللحظي -->
    <script>
        let socket = null;
        let deviceId = localStorage.getItem('device_id') || ('dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36));
        localStorage.setItem('device_id', deviceId);

        let currentRoom = '';
        let currentUsername = '';
        let currentRoomPass = '';
        let activeReplyTo = null;
        let oldestMsgId = null;
        let selectedFile = null;

        // 1. التحقق من كلمة السر العامة للموقع عند الفتح
        window.onload = function() {
            if (sessionStorage.getItem('global_auth') === 'true') {
                document.getElementById('globalModal').style.display = 'none';
                document.getElementById('authScreen').style.display = 'block';
            }
        };

        async function verifyGlobalPassword() {
            const pass = document.getElementById('globalPasswordInput').value;
            const res = await fetch('/api/check_global_pass', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            });

            if (res.ok) {
                sessionStorage.setItem('global_auth', 'true');
                document.getElementById('globalModal').style.display = 'none';
                document.getElementById('authScreen').style.display = 'block';
            } else {
                document.getElementById('globalErr').style.display = 'block';
            }
        }

        // 2. التبديل بين التبويبات (دخول / إنشاء)
        function switchTab(type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if (type === 'join') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('joinForm').style.display = 'block';
                document.getElementById('createForm').style.display = 'none';
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('joinForm').style.display = 'none';
                document.getElementById('createForm').style.display = 'block';
            }
        }

        // 3. إنشاء غرفة جديدة
        async function createRoom() {
            const name = document.getElementById('createRoomName').value.trim();
            const password = document.getElementById('createRoomPass').value.trim();

            if (!name || !password) return alert('يرجى ملء جميع الحقول!');

            const res = await fetch('/create_room', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, password })
            });
            const data = await res.json();
            alert(data.msg);
            if (data.msg.includes('نجاح')) switchTab('join');
        }

        // 4. الانضمام إلى الغرفة وبدء SocketIO
        function joinRoom() {
            currentUsername = document.getElementById('joinUsername').value.trim();
            currentRoom = document.getElementById('joinRoomName').value.trim();
            currentRoomPass = document.getElementById('joinRoomPass').value.trim();

            if (!currentUsername || !currentRoom || !currentRoomPass) return alert('يرجى ملء جميع البيانات!');

            if (!socket) socket = io();

            setupSocketEvents();

            socket.emit('join', {
                room: currentRoom,
                password: currentRoomPass,
                username: currentUsername,
                device_id: deviceId
            });
        }

        // 5. إعداد مستمعات SocketIO
        function setupSocketEvents() {
            socket.off('join_status');
            socket.on('join_status', status => {
                if (status === 'success') {
                    document.getElementById('authScreen').style.display = 'none';
                    document.getElementById('chatScreen').style.display = 'flex';
                    document.getElementById('displayRoomName').innerText = currentRoom;
                    document.getElementById('displayUsername').innerText = `المستخدم: ${currentUsername}`;
                } else if (status === 'banned') {
                    alert('أنت محظور من دخول هذه المحادثة.');
                } else {
                    alert('اسم الغرفة أو كلمة السر غير صحيحة!');
                }
            });

            socket.off('update_users');
            socket.on('update_users', data => {
                const list = document.getElementById('onlineUsersList');
                list.innerHTML = '';
                document.getElementById('onlineCount').innerText = data.users.length;
                data.users.forEach(u => {
                    list.innerHTML += `<div class="user-item"><span class="status-dot"></span>${u}</div>`;
                });
            });

            socket.off('offline_history_update');
            socket.on('offline_history_update', data => {
                const list = document.getElementById('offlineUsersList');
                list.innerHTML = '';
                for (let u in data) {
                    list.innerHTML += `<div class="user-item"><span class="status-dot offline"></span><div><div>${u}</div><div style="font-size:0.7rem; color:var(--text-muted);">${data[u].time} - ${data[u].reason}</div></div></div>`;
                }
            });

            socket.off('load_history');
            socket.on('load_history', messages => {
                const container = document.getElementById('messagesList');
                container.innerHTML = '';
                if (messages.length > 0) oldestMsgId = messages[0].id;
                messages.forEach(m => renderMessage(m, false));
                scrollToBottom();
                if (messages.length >= 150) document.getElementById('loadMoreBtn').style.display = 'block';
            });

            socket.off('receive_more_messages');
            socket.on('receive_more_messages', messages => {
                if (messages.length > 0) {
                    oldestMsgId = messages[messages.length - 1].id;
                    messages.reverse().forEach(m => renderMessage(m, true));
                } else {
                    document.getElementById('loadMoreBtn').style.display = 'none';
                }
            });

            socket.off('message');
            socket.on('message', m => {
                renderMessage(m, false);
                scrollToBottom();
            });

            socket.off('message_deleted');
            socket.on('message_deleted', data => {
                const el = document.getElementById(`msg-${data.id}`);
                if (el) el.remove();
            });

            socket.off('update_reaction');
            socket.on('update_reaction', data => {
                const bar = document.getElementById(`reactions-${data.msg_id}`);
                if (bar) {
                    bar.innerHTML = '';
                    for (let emoji in data.reactions) {
                        const count = data.reactions[emoji].length;
                        if (count > 0) {
                            bar.innerHTML += `<span class="reaction-badge" onclick="sendReaction(${data.msg_id}, '${emoji}')">${emoji} ${count}</span>`;
                        }
                    }
                }
            });

            socket.off('kick_banned');
            socket.on('kick_banned', () => {
                alert('تم حظرك من قبل الأدمن!');
                window.location.reload();
            });
        }

        // 6. بناء وعرض بطاقة الرسالة
        function renderMessage(m, prepend = false) {
            const list = document.getElementById('messagesList');
            const isMine = m.username === currentUsername;
            
            const card = document.createElement('div');
            card.id = `msg-${m.id}`;
            card.className = `message-card ${isMine ? 'my-msg' : ''}`;

            let replyHtml = m.reply_to ? `<div class="reply-preview-box">${m.reply_to}</div>` : '';
            let fileHtml = '';

            if (m.file) {
                if (m.file_type === 'image') fileHtml = `<div class="media-preview"><img src="${m.file}" onclick="window.open('${m.file}')"></div>`;
                else if (m.file_type === 'video') fileHtml = `<div class="media-preview"><video src="${m.file}" controls></video></div>`;
                else if (m.file_type === 'audio') fileHtml = `<div class="media-preview"><audio src="${m.file}" controls></audio></div>`;
                else fileHtml = `<div style="margin-top:0.5rem;"><a href="${m.file}" target="_blank" style="color:white;"><i class="fa-solid fa-file"></i> تحميل الملف</a></div>`;
            }

            let rxObj = {};
            try { rxObj = typeof m.reactions === 'string' ? JSON.parse(m.reactions) : m.reactions; } catch(e){}
            let reactionsHtml = '';
            for (let emoji in rxObj) {
                if (rxObj[emoji].length > 0) {
                    reactionsHtml += `<span class="reaction-badge" onclick="sendReaction(${m.id}, '${emoji}')">${emoji} ${rxObj[emoji].length}</span>`;
                }
            }

            card.innerHTML = `
                <div class="msg-actions">
                    <span class="action-btn" onclick="setReply('${m.username}: ${m.msg || 'ملف'}')"><i class="fa-solid fa-reply"></i></span>
                    <span class="action-btn" onclick="sendReaction(${m.id}, '👍')">👍</span>
                    <span class="action-btn" onclick="sendReaction(${m.id}, '❤️')">❤️</span>
                    <span class="action-btn" onclick="sendReaction(${m.id}, '😂')">😂</span>
                    ${isMine ? `<span class="action-btn" style="color:var(--danger);" onclick="deleteMessage(${m.id})"><i class="fa-solid fa-trash"></i></span>` : ''}
                </div>
                <div class="msg-header">
                    <span>${m.username}</span>
                    <span>${m.time}</span>
                </div>
                ${replyHtml}
                <div>${m.msg || ''}</div>
                ${fileHtml}
                <div class="reactions-bar" id="reactions-${m.id}">${reactionsHtml}</div>
            `;

            if (prepend) list.prepend(card);
            else list.appendChild(card);
        }

        // 7. التعامل مع أجزاء رفع الملفات (Chunk Upload)
        function handleFileSelect() {
            const input = document.getElementById('fileInput');
            if (input.files.length > 0) {
                selectedFile = input.files[0];
                document.getElementById('selectedFileName').innerText = `الملف المرفق: ${selectedFile.name}`;
            }
        }

        async function uploadFileInChunks(file) {
            const chunkSize = 1024 * 1024; // 1MB لكل جزء
            const totalChunks = Math.ceil(file.size / chunkSize);
            const uniqueFilename = `${Date.now()}_${file.name}`;

            const pContainer = document.getElementById('uploadProgressContainer');
            const pBar = document.getElementById('uploadProgressBar');
            pContainer.style.display = 'block';

            for (let i = 0; i < totalChunks; i++) {
                const start = i * chunkSize;
                const end = Math.min(file.size, start + chunkSize);
                const chunk = file.slice(start, end);

                const formData = new FormData();
                formData.append('chunk', chunk);
                formData.append('filename', uniqueFilename);

                await fetch('/upload_chunk', { method: 'POST', body: formData });

                const percent = Math.round(((i + 1) / totalChunks) * 100);
                pBar.style.width = `${percent}%`;
            }

            pContainer.style.display = 'none';
            pBar.style.width = '0%';
            return uniqueFilename;
        }

        // 8. إرسال الرسائل وتأكيد التفاعل
        async function sendMessage() {
            const textInput = document.getElementById('messageInput');
            const msgText = textInput.value.trim();

            if (!msgText && !selectedFile) return;

            let uploadedFileName = null;
            if (selectedFile) {
                uploadedFileName = await uploadFileInChunks(selectedFile);
                selectedFile = null;
                document.getElementById('selectedFileName').innerText = '';
                document.getElementById('fileInput').value = '';
            }

            socket.emit('message', {
                room: currentRoom,
                username: currentUsername,
                msg: msgText,
                reply_to: activeReplyTo,
                file: uploadedFileName
            });

            textInput.value = '';
            cancelReply();
        }

        function setReply(text) {
            activeReplyTo = text;
            document.getElementById('replyTargetText').innerText = `الرد على: ${text}`;
            document.getElementById('replyTargetBar').style.display = 'flex';
        }

        function cancelReply() {
            activeReplyTo = null;
            document.getElementById('replyTargetBar').style.display = 'none';
        }

        function sendReaction(msgId, emoji) {
            socket.emit('send_reaction', { msg_id: msgId, emoji: emoji });
        }

        function deleteMessage(id) {
            if (confirm('هل أنت تأكد من حذف هذه الرسالة؟')) {
                socket.emit('delete_message', { id: id });
            }
        }

        function loadMoreMessages() {
            if (oldestMsgId) {
                socket.emit('request_more_messages', { room: currentRoom, oldest_id: oldestMsgId });
            }
        }

        function leaveRoom() {
            if (socket) {
                socket.emit('leave_room', { room: currentRoom, username: currentUsername, reason: 'خروج عادي' });
            }
            document.getElementById('chatScreen').style.display = 'none';
            document.getElementById('authScreen').style.display = 'block';
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }

        // 9. إشعار السيرفر عبر Beacon عند إغلاق التبويب فجأة
        window.addEventListener('beforeunload', () => {
            if (currentRoom && currentUsername) {
                const data = JSON.stringify({
                    user: currentUsername,
                    room: currentRoom,
                    reason: 'إغلاق التبويب / خروج مفاجئ',
                    time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
                });
                navigator.sendBeacon('/api/user-disconnect', data);
            }
        });
    </script>
</body>
</html>
